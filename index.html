<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShinePro360 बुकिंग</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Mukta:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f7; --card:#ffffff; --ink:#12262e; --muted:#5b707a; --line:#d5dfe3;
  --brand:#0b6b75; --brand-ink:#ffffff; --accent:#f2b134; --danger:#b3261e; --ok:#17794a;
  --booked:#e3e8ea; --booked-ink:#8a9aa2; --sel:#0b6b75;
  --font-display:'Mukta','Hind',system-ui,sans-serif; --font-body:'Hind',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1a1f; --card:#162830; --ink:#e8f0f2; --muted:#9db1b9; --line:#2b424c;
  --brand:#3fb5c2; --brand-ink:#06242a; --accent:#f2b134; --danger:#ff8a80; --ok:#5fd39b;
  --booked:#22363f; --booked-ink:#6f858f; --sel:#3fb5c2; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px}
.wrap{max-width:520px;margin:0 auto}
header{padding:24px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{font:inherit;font-weight:600;font-size:15px;min-height:40px;padding:0 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.lang button.on{background:var(--brand);color:var(--brand-ink)}
.logo{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.2px}
.logo span{color:var(--brand)}
header p{margin:4px 0 0;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px}
.tabs button{font:inherit;font-weight:600;font-size:15px;line-height:1.2;min-height:48px;padding:6px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
@media (max-width:460px){.tabs{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px}
h2.t{margin:0;font-family:var(--font-display);font-size:22px}
label,.lbl{display:block;font-weight:600;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=tel],input[type=number],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.err{color:var(--danger);font-size:14px;margin-top:4px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.cal{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:var(--font-display);font-size:19px}
.nav{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:13px;color:var(--muted);padding:4px 0}
.day{height:48px;border-radius:9px;border:0;font:inherit;font-weight:500;background:var(--card);color:var(--ink);cursor:pointer;padding:0;line-height:1.1}
.day small{display:block;font-size:10px;line-height:1;font-weight:700;color:var(--ok);margin-top:2px}
.day.off{background:transparent;color:var(--booked-ink);cursor:default;opacity:.55}
.day.booked{background:var(--booked);color:var(--booked-ink);text-decoration:line-through;cursor:not-allowed}
.day.hot{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{background:var(--sel);color:var(--brand-ink);font-weight:700}
.day.sel small{color:var(--brand-ink)}
.day.blank{background:transparent;cursor:default}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.picked{margin-top:8px;font-weight:600;color:var(--brand)}
.note{font-size:14px;color:var(--muted)}
.est{background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.est .r{display:flex;justify-content:space-between;gap:10px}
.est .r b{font-variant-numeric:tabular-nums}
.est .f{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-size:17px}
.est .g{color:var(--ok)}
.terms{background:var(--bg);border-radius:10px;padding:14px 16px;font-size:15px}
.terms ul{margin:6px 0 0;padding-left:20px}
.terms li{margin:4px 0}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:500}
.chk input{width:24px;height:24px;margin-top:3px;flex:none}
.addons{display:flex;flex-direction:column;gap:12px}
.plan{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);font-weight:400;margin:0;cursor:pointer}
.plan input{width:22px;height:22px;margin-top:3px;flex:none}
.plan b{font-size:18px}
.plan .pr{font-family:var(--font-display);font-weight:800;color:var(--brand);font-size:19px;white-space:nowrap}
.plan .d{font-size:14px;color:var(--muted)}
.plan .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plan .body{flex:1;min-width:0}
.prod{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg);font-weight:500;margin:0}
.prod input[type=checkbox]{width:22px;height:22px;flex:none}
.prod span{flex:1;min-width:0}
.prod input[type=number]{width:84px;min-height:42px;flex:none}
.btn{font:inherit;font-weight:700;font-size:18px;min-height:54px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
.banner{border-radius:10px;padding:12px 14px;font-size:15px}
.banner.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);border:1px solid var(--danger)}
.done{text-align:center;gap:14px;align-items:center}
.ref{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:3px;color:var(--brand);background:var(--bg);border-radius:12px;padding:8px 18px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px}
footer{margin-top:18px;text-align:center;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.day,.btn,.tabs button{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><div class="logo">Shine<span>Pro360</span></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" id="lhi">हिंदी</button><button type="button" id="len">English</button></div></div>
  <p data-i18n="tagline">x</p>
</header>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="book" data-i18n="tab_book">x</button>
  <button type="button" data-tab="amc" data-i18n="tab_amc">x</button>
  <button type="button" data-tab="products" data-i18n="tab_prod">x</button>
  <button type="button" data-tab="enquiry" data-i18n="tab_enq">x</button>
</nav>

<!-- ===== ऑर्डर बुक करें ===== -->
<section id="tab-book">
<form id="form" class="card" novalidate>
  <div id="topErr" class="banner bad" hidden></div>
  <div><label for="customer_name" data-i18n="l_name">x</label>
    <input type="text" id="customer_name" maxlength="100" autocomplete="name"><div class="err" data-for="customer_name"></div></div>
  <div><label for="gym_name" data-i18n="l_gym">x</label>
    <input type="text" id="gym_name" maxlength="150"><div class="err" data-for="gym_name"></div></div>
  <div><label for="phone"><span data-i18n="l_phone">x</span> <span class="hint" data-i18n="h_phone">x</span></label>
    <input type="tel" id="phone" inputmode="numeric" maxlength="14" autocomplete="tel"><div class="err" data-for="phone"></div></div>
  <div><label for="city" data-i18n="l_city">x</label>
    <input type="text" id="city" maxlength="80" value="Kanpur"><div class="err" data-for="city"></div></div>
  <div><label for="address" data-i18n="l_addr">x</label>
    <textarea id="address" maxlength="300"></textarea><div class="err" data-for="address"></div></div>
  <div><label for="service" data-i18n="l_service">x</label>
    <select id="service">
      <option value="" data-i18n="choose">x</option>
      <option value="Floor Care Service">Floor Care Service (₹3 / sq ft)</option>
      <option value="Full Deep Cleaning">Full Deep Cleaning (₹5 / sq ft)</option>
    </select><div class="err" data-for="service"></div></div>

  <div id="areaBox" hidden>
    <label for="area_sqft"><span data-i18n="l_area">x</span> <span class="hint" data-i18n="h_area">x</span></label>
    <input type="number" id="area_sqft" inputmode="numeric" min="1" max="1000000" step="1">
    <div class="err" data-for="area_sqft"></div>
  </div>

  <div id="addons" class="addons" hidden>
    <span class="lbl" style="margin:0" data-i18n="l_addons">x</span>
    <label class="chk" for="ad_dumb" style="margin:0"><input type="checkbox" id="ad_dumb"><span data-i18n="ad_dumb">x</span></label>
    <div id="mirrorBox" class="addons">
      <label class="chk" for="ad_mirror" style="margin:0"><input type="checkbox" id="ad_mirror"><span data-i18n="ad_mirror">x</span></label>
      <div id="mirrorArea" hidden>
        <label for="mirror_sqft" data-i18n="l_mirror_area">x</label>
        <input type="number" id="mirror_sqft" inputmode="numeric" min="1" max="100000" step="1">
        <div class="err" data-for="mirror_sqft"></div>
      </div>
    </div>
  </div>
  <div id="deepNote" class="note" hidden data-i18n="deepNote">x</div>

  <div id="est" class="est" hidden></div>

  <div>
    <span class="lbl" data-i18n="l_date">x</span>
    <div class="cal" id="cal">
      <div class="cal-head">
        <button type="button" class="nav" id="prev" aria-label="Previous month">‹</button>
        <b id="monthName"></b>
        <button type="button" class="nav" id="next" aria-label="Next month">›</button>
      </div>
      <div class="grid" id="dows"></div>
      <div class="grid" id="days"></div>
      <div class="legend">
        <span><i style="background:var(--card);border:1px solid var(--line)"></i><span data-i18n="lg_free">x</span></span>
        <span><i style="background:var(--booked)"></i><span data-i18n="lg_booked">x</span></span>
        <span><i style="background:var(--sel)"></i><span data-i18n="lg_sel">x</span></span>
        <span><i style="box-shadow:inset 0 0 0 2px var(--accent)"></i><span data-i18n="lg_hot">x</span></span>
      </div>
      <div class="note" style="margin-top:8px" id="offerInfo"></div>
    </div>
    <div class="picked" id="picked"></div>
    <div class="note" id="twoDay" hidden data-i18n="twoDay">x</div>
    <div class="err" data-for="preferred_date"></div>
    <div id="calErr" class="note" hidden data-i18n="calErr">x</div>
  </div>

  <div><label for="notes" data-i18n="l_notes">x</label>
    <textarea id="notes" maxlength="500"></textarea></div>

  <div class="terms">
    <b data-i18n="t_title">x</b>
    <ul>
      <li data-i18n-html="t1">x</li>
      <li data-i18n-html="t2">x</li>
      <li data-i18n-html="t3">x</li>
    </ul>
  </div>
  <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
  <label class="chk" for="agree"><input type="checkbox" id="agree"><span data-i18n="agree">x</span></label>
  <div class="err" data-for="agree"></div>
  <button class="btn" id="submit" type="submit" data-i18n="send">x</button>
</form>

<section id="success" class="card done" hidden>
  <div class="tick" aria-hidden="true">✓</div>
  <h2 style="margin:0;font-family:var(--font-display)" data-i18n="ok_title">x</h2>
  <div data-i18n="ok_ref">x</div>
  <div class="ref" id="refCode"></div>
  <p style="margin:0" data-i18n-html="ok_p1">x</p>
  <p class="note" style="margin:0" data-i18n="ok_p2">x</p>
</section>
</section>

<!-- ===== AMC ===== -->
<section id="tab-amc" hidden>
<form id="amcForm" class="card" novalidate data-kind="amc">
  <h2 class="t" data-i18n="amc_title">x</h2>
  <div class="note" data-i18n="amc_note">x</div>
  <div id="amc_top" class="banner bad" hidden></div>
  <div>
    <span class="lbl" data-i18n="l_plan">x</span>
    <div style="display:flex;flex-direction:column;gap:10px">
      <label class="plan" for="plan_e"><input type="radio" name="plan" id="plan_e" value="Essential Care"><div class="body"><div class="h"><b>Essential Care</b><span class="pr">₹3,000<span class="hint" data-i18n="per_month">x</span></span></div><div class="d" data-i18n="pl_e">x</div></div></label>
      <label class="plan" for="plan_a"><input type="radio" name="plan" id="plan_a" value="Advanced Care"><div class="body"><div class="h"><b>Advanced Care</b><span class="pr">₹4,500<span class="hint" data-i18n="per_month">x</span></span></div><div class="d" data-i18n="pl_a">x</div></div></label>
      <label class="plan" for="plan_c"><input type="radio" name="plan" id="plan_c" value="Complete Care"><div class="body"><div class="h"><b>Complete Care</b><span class="pr">₹5,000<span class="hint" data-i18n="per_month">x</span></span></div><div class="d" data-i18n="pl_c">x</div></div></label>
    </div>
    <div class="err" data-for="amc_plan"></div>
  </div>
  <div><label for="amc_area"><span data-i18n="l_area">x</span> <span class="hint" data-i18n="h_area">x</span></label>
    <input type="number" id="amc_area" inputmode="numeric" min="1" max="1000000" step="1"><div class="err" data-for="amc_area"></div>
    <div id="amc_est" class="note" style="margin-top:6px" hidden></div></div>
  <div class="common" data-p="amc"></div>
  <div><label for="amc_details"><span data-i18n="l_notes">x</span></label><textarea id="amc_details" maxlength="800"></textarea></div>
  <button class="btn" type="submit" data-i18n="send_lead">x</button>
</form>
</section>

<!-- ===== प्रोडक्ट ===== -->
<section id="tab-products" hidden>
<form id="prodForm" class="card" novalidate data-kind="product">
  <h2 class="t" data-i18n="prod_title">x</h2>
  <div class="note" data-i18n="prod_note">x</div>
  <div id="prod_top" class="banner bad" hidden></div>
  <div style="display:flex;flex-direction:column;gap:10px" id="prodList"></div>
  <div class="err" data-for="prod_items"></div>
  <div class="common" data-p="prod"></div>
  <div><label for="prod_details"><span data-i18n="l_addr_opt">x</span></label><textarea id="prod_details" maxlength="500"></textarea></div>
  <button class="btn" type="submit" data-i18n="send_lead">x</button>
</form>
</section>

<!-- ===== पूछताछ ===== -->
<section id="tab-enquiry" hidden>
<form id="enqForm" class="card" novalidate data-kind="enquiry">
  <h2 class="t" data-i18n="enq_title">x</h2>
  <div id="enq_top" class="banner bad" hidden></div>
  <div class="common" data-p="enq"></div>
  <div><label for="enq_details" data-i18n="l_msg">x</label><textarea id="enq_details" maxlength="800"></textarea>
    <div class="err" data-for="enq_details"></div></div>
  <button class="btn" type="submit" data-i18n="send_lead">x</button>
</form>
</section>

<!-- एक साझा धन्यवाद कार्ड (तीनों पूछताछ फ़ॉर्म के लिए) -->
<section id="leadOk" class="card done" hidden>
  <div class="tick" aria-hidden="true">✓</div>
  <h2 style="margin:0;font-family:var(--font-display)" data-i18n="lead_ok_title">x</h2>
  <div class="ref" id="leadRef"></div>
  <p style="margin:0" data-i18n="lead_ok_p">x</p>
  <button class="btn sec" type="button" id="leadAgain" data-i18n="again">x</button>
</section>

<footer data-i18n="footer">x</footer>
</div>

<script>
(function(){
  var API = "https://nohnzyyaawarvhrmaota.supabase.co/functions/v1/public-booking";

  // ===== दाम और ऑफ़र (यहाँ बदलें) =====
  var RATES = {"Floor Care Service":3, "Full Deep Cleaning":5};   // ₹ प्रति वर्ग फ़ुट
  var MIRROR_RATE = 1.5, DUMBBELL_PRICE = 1500;
  // ऑफ़र की सेटिंग एडमिन पैनल से बदलती है और सर्वर से आती है। नीचे सिर्फ़ शुरुआती (बैकअप) मान हैं।
  var OFF = {base_pct:5, base_until:"2026-11-30", weekday_pct:{"2":10,"4":10}};
  // ====================================
  function offerPct(s){
    if(!s) return 0;
    var a=s.split("-"), wd=new Date(Date.UTC(+a[0],+a[1]-1,+a[2])).getUTCDay();
    var p=+((OFF.weekday_pct||{})[wd]||0);
    var bp=+OFF.base_pct||0;
    if(bp>0 && (!OFF.base_until || s<=OFF.base_until)) p=Math.max(p,bp);
    return Math.max(0,Math.min(20,p));
  }
  function offerText(){
    var names=T[LANG].wd, by={};
    for(var d=0;d<7;d++){var p=+((OFF.weekday_pct||{})[d]||0); if(p>0)(by[p]=by[p]||[]).push(names[d])}
    var parts=Object.keys(by).sort(function(x,y){return y-x}).map(function(p){return by[p].join(", ")+" "+p+"%"});
    var bp=+OFF.base_pct||0;
    if(!parts.length && bp<=0) return "";
    var s=t("oi_head")+" ";
    if(parts.length) s+=parts.join("; ")+". ";
    if(bp>0) s+=t("oi_base")(parts.length>0,bp,OFF.base_until?fmt(OFF.base_until):"")+" ";
    return s+t("oi_full");
  }

  var PRODUCTS = ["Gym Rubber Floor Cleaner","Gym Floor Polish","Dumbbell & Weight Plate Cleaner and Polish","Normal Floor Cleaner","Hand Wash Liquid"];

  var T = {
    hi:{
      tagline:"जिम की सफ़ाई सेवा – कानपुर। फ़ॉर्म भरें, हम आपको कॉल करेंगे।",
      tab_book:"ऑर्डर बुक करें", tab_amc:"AMC प्लान", tab_prod:"प्रोडक्ट", tab_enq:"पूछताछ",
      l_name:"आपका नाम", l_gym:"जिम का नाम", l_phone:"मोबाइल नंबर", h_phone:"(10 अंक, WhatsApp वाला हो तो बेहतर)",
      l_city:"शहर", l_addr:"जिम का पूरा पता", l_service:"सेवा चुनें", choose:"-- चुनें --",
      l_area:"जिम का क्षेत्रफल", h_area:"(वर्ग फ़ुट में)", opt:"(वैकल्पिक)",
      l_addons:"ऐड-ऑन (वैकल्पिक)",
      ad_dumb:"Dumbbell व Weight Plates सफ़ाई (+₹1,500, 30 dumbbell और 30 plates तक)",
      ad_mirror:"Mirror / Glass सफ़ाई (₹1.50 प्रति वर्ग फ़ुट)",
      l_mirror_area:"Mirror / Glass का क्षेत्रफल (वर्ग फ़ुट)",
      deepNote:"Full Deep Cleaning में Mirror/Glass और Equipment (Dumbbell समेत) की सफ़ाई पहले से शामिल है, अलग ऐड-ऑन की ज़रूरत नहीं।",

  // ---------- तारीख़ें ----------
  function istToday(){
    var p = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    var a = p.split("-"); return new Date(Date.UTC(+a[0],+a[1]-1,+a[2]));
  }
  function iso(d){return d.toISOString().slice(0,10)}
  function addDays(d,n){return new Date(d.getTime()+n*86400000)}
  var today = istToday(), minDate = addDays(today,1), maxDate = addDays(today,120);
  var booked = {}, selected = "";
  var view = new Date(Date.UTC(minDate.getUTCFullYear(),minDate.getUTCMonth(),1));

  function needsTwoDays(){ return !!$("service").value && (+$("area_sqft").value)>1500; }
  function isFree(s){
    if(booked[s]) return false;
    if(needsTwoDays()){ var n = iso(addDays(new Date(s+"T00:00:00Z"),1)); if(booked[n]) return false; }
    return true;
  }
  function fmt(s){var a=s.split("-");return +a[2]+" "+t("months")[+a[1]-1]+" "+a[0]}

  function render(){
    var y = view.getUTCFullYear(), m = view.getUTCMonth();
    $("monthName").textContent = t("months")[m]+" "+y;
    $("dows").innerHTML = t("dows").map(function(d){return '<div class="dow">'+d+'</div>'}).join("");
    var first = new Date(Date.UTC(y,m,1)).getUTCDay();
    var count = new Date(Date.UTC(y,m+1,0)).getUTCDate();
    var html = "";
    for(var i=0;i<first;i++) html += '<div class="day blank"></div>';
    for(var d=1; d<=count; d++){
      var dt = new Date(Date.UTC(y,m,d)), s = iso(dt), cls = "day", dis = false, badge = "";
      if(dt<minDate || dt>maxDate){cls+=" off"; dis=true}
      else if(!isFree(s)){cls+=" booked"; dis=true}
      else {
        var p = offerPct(s);
        if(p>0){ badge='<small>'+p+'%</small>'; if(p>=10) cls+=" hot"; }
        if(s===selected) cls+=" sel";
      }
      html += '<button type="button" class="'+cls+'" data-d="'+s+'"'+(dis?' disabled':'')+'>'+d+badge+'</button>';
    }
    $("days").innerHTML = html;
    $("prev").disabled = (y===minDate.getUTCFullYear() && m<=minDate.getUTCMonth()) || (y<minDate.getUTCFullYear());
    var maxV = new Date(Date.UTC(maxDate.getUTCFullYear(),maxDate.getUTCMonth(),1));
    $("next").disabled = view>=maxV;
    var po = offerPct(selected);
    $("picked").textContent = selected ? t("picked")+fmt(selected)+(po?" · "+po+"% "+t("offerWord"):"") : "";
    $("twoDay").hidden = !needsTwoDays();
    var ot=offerText(); $("offerInfo").textContent=ot; $("offerInfo").hidden=!ot;
  }

  // ---------- रकम का अनुमान ----------
  function calcQuote(){
    var sv=$("service").value, a=+$("area_sqft").value;
    if(!sv || !(a>0)) return null;
    var base=a*RATES[sv], add=0;
    if(sv==="Floor Care Service" && $("ad_dumb").checked) add+=DUMBBELL_PRICE;
    if(sv==="Floor Care Service" && $("ad_mirror").checked){var m=+$("mirror_sqft").value; if(m>0) add+=m*MIRROR_RATE;}
    var total=base+add, pct=offerPct(selected), fin=Math.round(total*(100-pct)/100);
    return {base:base,add:add,total:total,pct:pct,fin:fin,adv:Math.round(fin*0.2)};
  }
  function updateEst(){
    var q=calcQuote(), box=$("est");
    if(!q){box.hidden=true;return}
    var h='<div class="r"><span>'+t("r_svc")+'</span><b>₹'+inr(q.base)+'</b></div>';
    if(q.add>0) h+='<div class="r"><span>'+t("r_add")+'</span><b>₹'+inr(q.add)+'</b></div>';
    if(q.pct>0){
      h+='<div class="r"><span>'+t("r_total")+'</span><b>₹'+inr(q.total)+'</b></div>';
      h+='<div class="r g"><span>'+t("r_disc")+' ('+q.pct+'%)</span><b>− ₹'+inr(q.total-q.fin)+'</b></div>';
    }
    h+='<div class="r f"><span>'+t("r_final")+'</span><b>₹'+inr(q.fin)+'</b></div>';
    h+='<div class="r"><span>'+t("r_adv")+'</span><b>₹'+inr(q.adv)+'</b></div>';
    h+='<div class="note" style="margin-top:6px">'+t("r_note")+'</div>';
    box.innerHTML=h; box.hidden=false;
  }
  function refresh(){ updateEst(); if(selected && !isFree(selected)) selected=""; render(); }

  function updateService(){
    var v=$("service").value;
    $("areaBox").hidden=!v; $("addons").hidden = v!=="Floor Care Service";
    $("deepNote").hidden = v!=="Full Deep Cleaning";
    if(v!=="Floor Care Service"){$("ad_dumb").checked=false;$("ad_mirror").checked=false;$("mirrorArea").hidden=true}
    refresh();
  }
  $("service").addEventListener("change",updateService);
  $("area_sqft").addEventListener("input",refresh);
  $("ad_dumb").addEventListener("change",refresh);
  $("ad_mirror").addEventListener("change",function(){$("mirrorArea").hidden=!this.checked; refresh()});
  $("mirror_sqft").addEventListener("input",updateEst);

  $("days").addEventListener("click",function(e){
    var b=e.target.closest("button.day"); if(!b||b.disabled) return;
    selected=b.getAttribute("data-d"); setErr("preferred_date",""); updateEst(); render();
  });
  $("prev").onclick=function(){view=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()-1,1)); render()};
  $("next").onclick=function(){view=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()+1,1)); render()};

  function loadBooked(){
    fetch(API).then(function(r){return r.json()}).then(function(j){
      if(!j||!j.ok) throw 0;
      if(j.offers && typeof j.offers==="object") OFF=j.offers;
      booked={}; (j.booked_days||[]).forEach(function(d){booked[String(d).slice(0,10)]=1});
      if(selected && !isFree(selected)) selected="";
      $("calErr").hidden=true; updateEst(); render();
    }).catch(function(){$("calErr").hidden=false});
  }

  function post(body,done){
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {s:r.status,j:j}})})
      .then(done)
      .catch(function(){done({s:0,j:{}})});
  }
  function failKey(o){
    if(o.s===409){var m=(o.j&&o.j.error)||""; return m.indexOf("phone number")>=0?"s_phone":"s_taken"}
    if(o.s===429) return "s_429";
    if(o.s===400) return "s_400";
    if(o.s===0) return "s_net";
    return "s_500";
  }

  // ---------- बुकिंग भेजना ----------
  var BUSY=false;
  function validateBook(){
    clearErrs($("form")); hideTop("topErr"); var ok=true;
    function bad(k,m){setErr(k,m); ok=false}
    if(!$("customer_name").value.trim()) bad("customer_name","e_name");
    if(!$("gym_name").value.trim()) bad("gym_name","e_gym");
    if(!okPhone($("phone").value)) bad("phone","e_phone");
    if(!$("city").value.trim()) bad("city","e_city");
    if(!$("address").value.trim()) bad("address","e_addr");
    var sv=$("service").value;
    if(!sv) bad("service","e_service");
    else {
      var a=$("area_sqft").value;
      if(!/^\d+$/.test(a)||+a<1||+a>1000000) bad("area_sqft","e_area");
      if(sv==="Floor Care Service" && $("ad_mirror").checked){
        var mm=$("mirror_sqft").value; if(!/^\d+$/.test(mm)||+mm<1||+mm>100000) bad("mirror_sqft","e_mirror");
      }
    }
    if(!selected) bad("preferred_date","e_date"); else if(!isFree(selected)) bad("preferred_date","e_taken");
    if(!$("agree").checked) bad("agree","e_agree");
    return ok;
  }
  $("form").addEventListener("submit",function(e){
    e.preventDefault(); if(BUSY) return;
    if(!validateBook()){firstErr($("form"));return}
    var sv=$("service").value;
    var body={
      customer_name:$("customer_name").value.trim(), gym_name:$("gym_name").value.trim(),
      phone:normPhone($("phone").value), city:$("city").value.trim(), address:$("address").value.trim(),
      service:sv, area_sqft:+$("area_sqft").value, preferred_date:selected, website:$("website").value,
      notes:$("notes").value.trim(),
      addons:{dumbbell:(sv==="Floor Care Service"&&$("ad_dumb").checked), mirror_sqft:(sv==="Floor Care Service"&&$("ad_mirror").checked)?+$("mirror_sqft").value:0}
    };
    BUSY=true; $("submit").disabled=true; $("submit").textContent=t("sending");
    post(body,function(o){
      BUSY=false; $("submit").disabled=false; $("submit").textContent=t("send");
      if(o.s===201&&o.j&&o.j.ok){
        $("refCode").textContent=o.j.reference||"OK"; $("form").hidden=true; $("success").hidden=false;
        window.scrollTo({top:0,behavior:"smooth"});
      } else { topErr("topErr",failKey(o)); if(o.s===409) loadBooked(); }
    });
  });

  // ---------- AMC / प्रोडक्ट / पूछताछ ----------
  var LEADS={
    amc:{form:"amcForm",p:"amc",top:"amc_top",
      check:function(){
        var ok=true;
        if(!document.querySelector('input[name=plan]:checked')){setErr("amc_plan","e_plan");ok=false}
        var a=$("amc_area").value; if(!/^\d+$/.test(a)||+a<1||+a>1000000){setErr("amc_area","e_area");ok=false}
        return ok;
      },
      body:function(b){
        b.plan=document.querySelector('input[name=plan]:checked').value;
        b.area_sqft=+$("amc_area").value; b.details=$("amc_details").value.trim();
      }},
    prod:{form:"prodForm",p:"prod",top:"prod_top",
      check:function(){
        var any=PRODUCTS.some(function(_,i){return $("pr"+i).checked});
        if(!any){setErr("prod_items","e_prod");return false}
        var ok=true;
        PRODUCTS.forEach(function(_,i){ if($("pr"+i).checked){var q=$("pq"+i).value; if(!/^\d+$/.test(q)||+q<1||+q>1000){ok=false;$("pq"+i).focus()}}});
        if(!ok) setErr("prod_items","e_prod");
        return ok;
      },
      body:function(b){
        b.items=[]; PRODUCTS.forEach(function(n,i){ if($("pr"+i).checked) b.items.push({name:n,qty:+$("pq"+i).value}) });
        b.details=$("prod_details").value.trim();
      }},
    enq:{form:"enqForm",p:"enq",top:"enq_top",
      check:function(){ if(!$("enq_details").value.trim()){setErr("enq_details","e_msg");return false} return true },
      body:function(b){ b.details=$("enq_details").value.trim() }}
  };
  var LBUSY=false;
  Object.keys(LEADS).forEach(function(k){
    var L=LEADS[k], f=$(L.form);
    f.addEventListener("submit",function(e){
      e.preventDefault(); if(LBUSY) return;
      clearErrs(f); hideTop(L.top);
      var ok=true;
      if(!$(L.p+"_name").value.trim()){setErr(L.p+"_name","e_name");ok=false}
      if(!okPhone($(L.p+"_phone").value)){setErr(L.p+"_phone","e_phone");ok=false}
      if(!L.check()) ok=false;
      if(!ok){firstErr(f);return}
      var body={type:f.getAttribute("data-kind"),customer_name:$(L.p+"_name").value.trim(),phone:normPhone($(L.p+"_phone").value),
        gym_name:$(L.p+"_gym").value.trim(),city:$(L.p+"_city").value.trim(),website:$(L.p+"_website").value};
      L.body(body);
      var btn=f.querySelector("button[type=submit]"); LBUSY=true; btn.disabled=true; btn.textContent=t("sending");
      post(body,function(o){
        LBUSY=false; btn.disabled=false; btn.textContent=t("send_lead");
        if(o.s===201&&o.j&&o.j.ok){
          $("leadRef").textContent=o.j.reference||"OK";
          f.hidden=true; f.parentNode.appendChild($("leadOk")); $("leadOk").hidden=false; $("leadOk").setAttribute("data-from",L.form);
          window.scrollTo({top:0,behavior:"smooth"});
        } else topErr(L.top,failKey(o));
      });
    });
  });
  $("amcForm").addEventListener("input",function(e){
    if(e.target.name==="plan") setErr("amc_plan","");
    var a=+$("amc_area").value, n=$("amc_est");
    if(a>1000){n.textContent=t("amc_big"); n.hidden=false; lastAmcBig=true} else {n.hidden=true; lastAmcBig=false}
  });
  var lastAmcBig=false;
  $("leadAgain").onclick=function(){
    var id=$("leadOk").getAttribute("data-from"); var f=$(id);
    f.reset(); f.querySelectorAll('input[type=checkbox]').forEach(function(c){c.checked=false});
    PRODUCTS.forEach(function(_,i){$("pq"+i).disabled=true});
    ["amc","prod","enq"].forEach(function(p){ if($(p+"_city")&&f.contains($(p+"_city"))) $(p+"_city").value="Kanpur" });
    $("amc_est").hidden=true;
    f.hidden=false; $("leadOk").hidden=true;
  };

  // ---------- टैब ----------
  var TABS=["book","amc","products","enquiry"];
  function showTab(name){
    if(TABS.indexOf(name)<0) name="book";
    TABS.forEach(function(n){ $("tab-"+n).hidden = n!==name });
    document.querySelectorAll(".tabs button").forEach(function(b){b.className = b.getAttribute("data-tab")===name?"on":""; b.setAttribute("aria-pressed",b.getAttribute("data-tab")===name)});
    var lead=$("leadOk");
    if(!lead.hidden && !$("tab-"+name).contains(lead)){
      lead.hidden=true; var ff=$(lead.getAttribute("data-from")); if(ff) ff.hidden=false;
    }
  }
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click",function(){ var n=b.getAttribute("data-tab"); if(location.hash!=="#"+n) location.hash=n; else showTab(n) });
  });
  window.addEventListener("hashchange",function(){showTab(location.hash.replace("#",""))});

  // ---------- भाषा ----------
  function applyLang(){
    document.documentElement.lang=LANG;
    document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent=t(e.getAttribute("data-i18n"))});
    document.querySelectorAll("[data-i18n-html]").forEach(function(e){e.innerHTML=t(e.getAttribute("data-i18n-html"))});
    $("lhi").className=LANG==="hi"?"on":""; $("len").className=LANG==="en"?"on":"";
    $("prev").setAttribute("aria-label",t("prev")); $("next").setAttribute("aria-label",t("next"));
    if(!BUSY) $("submit").textContent=t("send");
    document.querySelectorAll('#amcForm button[type=submit],#prodForm button[type=submit],#enqForm button[type=submit]').forEach(function(b){ if(!LBUSY) b.textContent=t("send_lead") });
    updateEst(); render();
    Object.keys(lastErr).forEach(function(k){setErr(k,lastErr[k])});
    Object.keys(lastTop).forEach(function(id){topErr(id,lastTop[id],true)});
    var n=$("amc_est"); if(!n.hidden) n.textContent=t("amc_big");
  }
  function setLang(l){LANG=l; try{localStorage.setItem("lang",l)}catch(e){} applyLang()}
  $("lhi").onclick=function(){setLang("hi")};
  $("len").onclick=function(){setLang("en")};

  applyLang(); loadBooked(); showTab(location.hash.replace("#",""));
})();
</script>
</body>
</html>
