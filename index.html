<!doctype html>
<html lang="hi" id="root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShinePro360 बुकिंग</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Mukta:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: एक कॉलम का मोबाइल फ़ॉर्म, ऊपर ब्रांड पट्टी, बीच में फ़ील्ड, नीचे शर्तें और बटन */
:root{
  --bg:#f3f6f7; --card:#ffffff; --ink:#12262e; --muted:#5b707a; --line:#d5dfe3;
  --brand:#0b6b75; --brand-ink:#ffffff; --accent:#f2b134; --danger:#b3261e; --ok:#17794a;
  --booked:#e3e8ea; --booked-ink:#8a9aa2; --sel:#0b6b75;
  --font-display:'Mukta','Hind',system-ui,sans-serif; --font-body:'Hind',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1a1f; --card:#162830; --ink:#e8f0f2; --muted:#9db1b9; --line:#2b424c;
  --brand:#3fb5c2; --brand-ink:#06242a; --accent:#f2b134; --danger:#ff8a80; --ok:#5fd39b;
  --booked:#22363f; --booked-ink:#6f858f; --sel:#3fb5c2; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px}
.wrap{max-width:520px;margin:0 auto}
header{padding:28px 0 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{font:inherit;font-weight:600;font-size:15px;min-height:40px;padding:0 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.lang button.on{background:var(--brand);color:var(--brand-ink)}
.logo{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.2px}
.logo span{color:var(--brand)}
header p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px}
label,.lbl{display:block;font-weight:600;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=tel],input[type=number],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.err{color:var(--danger);font-size:14px;margin-top:4px;min-height:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
/* calendar */
.cal{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:var(--font-display);font-size:19px}
.nav{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:13px;color:var(--muted);padding:4px 0}
.day{height:44px;border-radius:9px;border:0;font:inherit;font-weight:500;background:var(--card);color:var(--ink);cursor:pointer;padding:0}
.day.off{background:transparent;color:var(--booked-ink);cursor:default;opacity:.55}
.day.booked{background:var(--booked);color:var(--booked-ink);text-decoration:line-through;cursor:not-allowed}
.day.sel{background:var(--sel);color:var(--brand-ink);font-weight:700}
.day.blank{background:transparent;cursor:default}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.picked{margin-top:8px;font-weight:600;color:var(--brand)}
.note{font-size:14px;color:var(--muted)}
.est{background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.terms{background:var(--bg);border-radius:10px;padding:14px 16px;font-size:15px}
.terms ul{margin:6px 0 0;padding-left:20px}
.terms li{margin:4px 0}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:500}
.chk input{width:24px;height:24px;margin-top:3px;flex:none}
.btn{font:inherit;font-weight:700;font-size:18px;min-height:54px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);cursor:pointer;width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.banner{border-radius:10px;padding:12px 14px;font-size:15px}
.banner.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);border:1px solid var(--danger)}
.banner.warn{background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid var(--accent)}
.done{text-align:center;gap:14px;align-items:center}
.ref{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:3px;color:var(--brand);background:var(--bg);border-radius:12px;padding:8px 18px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px}
footer{margin-top:18px;text-align:center;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.day,.btn{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><div class="logo">Shine<span>Pro360</span></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" id="lhi">हिंदी</button><button type="button" id="len">English</button></div></div>
  <p data-i18n="tagline">जिम की सफ़ाई सेवा – कानपुर। नीचे फ़ॉर्म भरें, हम आपको कॉल करेंगे।</p>
</header>

<form id="form" class="card" novalidate>
  <div id="topErr" class="banner bad" hidden></div>

  <div>
    <label for="customer_name" data-i18n="l_name">आपका नाम</label>
    <input type="text" id="customer_name" maxlength="100" autocomplete="name">
    <div class="err" data-for="customer_name"></div>
  </div>

  <div>
    <label for="gym_name" data-i18n="l_gym">जिम का नाम</label>
    <input type="text" id="gym_name" maxlength="150">
    <div class="err" data-for="gym_name"></div>
  </div>

  <div>
    <label for="phone"><span data-i18n="l_phone">मोबाइल नंबर</span> <span class="hint" data-i18n="h_phone">(10 अंक, WhatsApp वाला हो तो बेहतर)</span></label>
    <input type="tel" id="phone" inputmode="numeric" maxlength="14" autocomplete="tel">
    <div class="err" data-for="phone"></div>
  </div>

  <div>
    <label for="city" data-i18n="l_city">शहर</label>
    <input type="text" id="city" maxlength="80" value="Kanpur">
    <div class="err" data-for="city"></div>
  </div>

  <div>
    <label for="address" data-i18n="l_addr">जिम का पूरा पता</label>
    <textarea id="address" maxlength="300"></textarea>
    <div class="err" data-for="address"></div>
  </div>

  <div>
    <label for="service" data-i18n="l_service">सेवा चुनें</label>
    <select id="service">
      <option value="" data-i18n="choose">-- चुनें --</option>
      <option value="Floor Care Service">Floor Care Service</option>
      <option value="Full Deep Cleaning">Full Deep Cleaning</option>
    </select>
    <div class="err" data-for="service"></div>
  </div>

  <div id="areaBox" hidden>
    <label for="area_sqft"><span data-i18n="l_area">जिम का क्षेत्रफल</span> <span class="hint" data-i18n="h_area">(वर्ग फ़ुट में)</span></label>
    <input type="number" id="area_sqft" inputmode="numeric" min="1" max="1000000" step="1">
    <div class="err" data-for="area_sqft"></div>
    <div id="est" class="est" style="margin-top:10px" hidden></div>
  </div>
  <div id="floorNote" class="note" hidden data-i18n="floorNote">Floor Care का रेट जिम देखने के बाद बताया जाएगा।</div>

  <div>
    <span class="lbl" data-i18n="l_date">काम की तारीख चुनें</span>
    <div class="cal" id="cal">
      <div class="cal-head">
        <button type="button" class="nav" id="prev" aria-label="Previous month">‹</button>
        <b id="monthName"></b>
        <button type="button" class="nav" id="next" aria-label="Next month">›</button>
      </div>
      <div class="grid" id="dows"></div>
      <div class="grid" id="days"></div>
      <div class="legend">
        <span><i style="background:var(--card);border:1px solid var(--line)"></i><span data-i18n="lg_free">खाली</span></span>
        <span><i style="background:var(--booked)"></i><span data-i18n="lg_booked">बुक है</span></span>
        <span><i style="background:var(--sel)"></i><span data-i18n="lg_sel">आपकी चुनी</span></span>
      </div>
    </div>
    <div class="picked" id="picked"></div>
    <div class="note" id="twoDay" hidden data-i18n="twoDay">x</div>
    <div class="err" data-for="preferred_date"></div>
    <div id="calErr" class="note" hidden data-i18n="calErr">x</div>
  </div>

  <div class="terms">
    <b data-i18n="t_title">ज़रूरी बातें</b>
    <ul>
      <li data-i18n-html="t1">x</li>
      <li data-i18n-html="t2">x</li>
      <li data-i18n-html="t3">x</li>
    </ul>
  </div>

  <div class="hp" aria-hidden="true">
    <label for="website">Website</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <label class="chk" for="agree">
    <input type="checkbox" id="agree">
    <span data-i18n="agree">x</span>
  </label>
  <div class="err" data-for="agree"></div>

  <button class="btn" id="submit" type="submit" data-i18n="send">बुकिंग भेजें</button>
</form>

<section id="success" class="card done" hidden>
  <div class="tick" aria-hidden="true">✓</div>
  <h2 style="margin:0;font-family:var(--font-display)" data-i18n="ok_title">x</h2>
  <div data-i18n="ok_ref">x</div>
  <div class="ref" id="refCode"></div>
  <p style="margin:0" data-i18n-html="ok_p1">x</p>
  <p class="note" style="margin:0" data-i18n="ok_p2">x</p>
</section>

<footer data-i18n="footer">x</footer>
</div>

<script>
(function(){
  var API = "https://nohnzyyaawarvhrmaota.supabase.co/functions/v1/public-booking";
  var RATE = 5;

  var T = {
    hi:{
      tagline:"जिम की सफ़ाई सेवा – कानपुर। नीचे फ़ॉर्म भरें, हम आपको कॉल करेंगे।",
      l_name:"आपका नाम", l_gym:"जिम का नाम", l_phone:"मोबाइल नंबर", h_phone:"(10 अंक, WhatsApp वाला हो तो बेहतर)",
      l_city:"शहर", l_addr:"जिम का पूरा पता", l_service:"सेवा चुनें", choose:"-- चुनें --",

      floorNote:"Floor Care का रेट जिम देखने के बाद बताया जाएगा।",

      twoDay:"1500 वर्ग फ़ुट से बड़े जिम में काम 2 दिन चलता है, इसलिए चुनी तारीख और अगली तारीख दोनों खाली होनी चाहिए।",
      calErr:"बुक हो चुकी तारीखें अभी लोड नहीं हो पाईं। फिर भी आप तारीख चुन सकते हैं, हम कॉल पर पक्का करेंगे।",
      t_title:"ज़रूरी बातें",
      t1:"फ़ॉर्म भरने पर तारीख <b>24 घंटे</b> के लिए रोकी जाती है। इस बीच हम आपको कॉल करेंगे।",
      t2:"तारीख पक्की करने के लिए कुल रकम का <b>20% एडवांस</b> UPI QR से देना होगा। 24 घंटे में एडवांस न मिला तो तारीख दूसरे ग्राहक के लिए खुल जाएगी।",

      send:"बुकिंग भेजें", sending:"भेज रहे हैं...",
      ok_title:"बुकिंग मिल गई", ok_ref:"आपका रेफ़रेंस कोड",
      ok_p1:"आपकी तारीख <b>24 घंटे</b> के लिए रोकी गई है। हम जल्द आपके नंबर पर कॉल करेंगे। कृपया फ़ोन उठाएँ।",
      ok_p2:"यह रेफ़रेंस कोड कॉल पर बताइएगा। एडवांस मिलने के बाद ही तारीख पक्की मानी जाएगी।",
      footer:"ShinePro360 · कानपुर",
      months:["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"],
      dows:["र","सो","मं","बु","गु","शु","श"],
      picked:"चुनी हुई तारीख: ",
      estLine:function(t,a,adv){return "अनुमानित रकम: <b>₹"+t+"</b> ("+a+" × ₹"+RATE+")<br>20% एडवांस: <b>₹"+adv+"</b>. अंतिम रकम कॉल पर पक्की होगी।"},
      e_name:"नाम लिखें।", e_gym:"जिम का नाम लिखें।", e_phone:"सही 10 अंक का मोबाइल नंबर लिखें।",
      e_city:"शहर लिखें।", e_addr:"पता लिखें।", e_service:"सेवा चुनें।",
      e_area:"क्षेत्रफल पूरी संख्या में लिखें, जैसे 1200।", e_date:"तारीख चुनें।", e_taken:"यह तारीख बुक है, दूसरी चुनें।",
      e_agree:"आगे बढ़ने के लिए सहमति ज़रूरी है।",

      s_400:"कुछ जानकारी सही नहीं है। कृपया फ़ॉर्म जाँचकर फिर भेजें।",
      s_500:"बुकिंग सेव नहीं हो पाई। कृपया थोड़ी देर बाद फिर कोशिश करें।",
      s_net:"इंटरनेट की दिक्कत लग रही है। कनेक्शन देखकर फिर कोशिश करें।",
      prev:"पिछला महीना", next:"अगला महीना"
    },
    en:{
      tagline:"Gym cleaning services in Kanpur. Fill in the form and we will call you.",
      l_name:"Your name", l_gym:"Gym name", l_phone:"Mobile number", h_phone:"(10 digits, preferably your WhatsApp number)",
      l_city:"City", l_addr:"Full gym address", l_service:"Select service", choose:"-- Select --",
      l_area:"Gym area", h_area:"(in square feet)",
      floorNote:"The Floor Care rate will be quoted after we inspect the gym.",
      l_date:"Choose the work date", lg_free:"Available", lg_booked:"Booked", lg_sel:"Your pick",
      twoDay:"Gyms above 1500 sq ft need 2 days of work, so the chosen date and the next date must both be free.",
      calErr:"Booked dates could not be loaded right now. You can still pick a date and we will confirm on the call.",
      t_title:"Important points",
      t1:"After you submit, your date is held for <b>24 hours</b>. We will call you in that time.",
      t2:"To confirm the date you must pay a <b>20% advance</b> of the total amount by UPI QR. If the advance is not received within 24 hours, the date opens up for other customers.",

      agree:"I have read the terms above and I agree.",
      send:"Submit booking", sending:"Sending...",

      prev:"Previous month", next:"Next month"
    }
  };

  var LANG = "hi";
  try{var sv=localStorage.getItem("lang"); if(sv==="hi"||sv==="en") LANG=sv;}catch(e){}
  function t(k){return T[LANG][k]}

  var $ = function(id){return document.getElementById(id)};

  function istToday(){
    var p = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    var a = p.split("-"); return new Date(Date.UTC(+a[0],+a[1]-1,+a[2]));
  }
  function iso(d){return d.toISOString().slice(0,10)}
  function addDays(d,n){return new Date(d.getTime()+n*86400000)}

  var today = istToday();
  var minDate = addDays(today,1);
  var maxDate = addDays(today,120);
  var booked = {};
  var selected = "";
  var view = new Date(Date.UTC(minDate.getUTCFullYear(),minDate.getUTCMonth(),1));
  var lastErr = {};   // key -> error key, to re-translate on language change

  function needsTwoDays(){
    return $("service").value==="Full Deep Cleaning" && (+$("area_sqft").value)>1500;
  }
  function isFree(s){
    if(booked[s]) return false;
    if(needsTwoDays()){
      var n = new Date(s+"T00:00:00Z"); n = iso(addDays(n,1));
      if(booked[n]) return false;
    }
    return true;
  }

  function fmt(s){var a=s.split("-");return +a[2]+" "+t("months")[+a[1]-1]+" "+a[0]}

  function render(){
    var y = view.getUTCFullYear(), m = view.getUTCMonth();
    $("monthName").textContent = t("months")[m]+" "+y;
    $("dows").innerHTML = t("dows").map(function(d){return '<div class="dow">'+d+'</div>'}).join("");
    var first = new Date(Date.UTC(y,m,1)).getUTCDay();
    var count = new Date(Date.UTC(y,m+1,0)).getUTCDate();
    var html = "";
    for(var i=0;i<first;i++) html += '<div class="day blank"></div>';
    for(var d=1; d<=count; d++){
      var dt = new Date(Date.UTC(y,m,d)); var s = iso(dt);
      var cls = "day", dis = false;
      if(dt<minDate || dt>maxDate){cls+=" off"; dis=true}
      else if(!isFree(s)){cls+=" booked"; dis=true}
      else if(s===selected){cls+=" sel"}
      html += '<button type="button" class="'+cls+'" data-d="'+s+'"'+(dis?' disabled':'')+'>'+d+'</button>';
    }
    $("days").innerHTML = html;
    $("prev").disabled = (y===minDate.getUTCFullYear() && m<=minDate.getUTCMonth()) || (y<minDate.getUTCFullYear());
    var maxV = new Date(Date.UTC(maxDate.getUTCFullYear(),maxDate.getUTCMonth(),1));
    $("next").disabled = view>=maxV;
    $("picked").textContent = selected ? t("picked")+fmt(selected) : "";
    $("twoDay").hidden = !needsTwoDays();
  }

  function applyLang(){
    document.documentElement.lang = LANG;
    document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent = t(e.getAttribute("data-i18n"))});
    document.querySelectorAll("[data-i18n-html]").forEach(function(e){e.innerHTML = t(e.getAttribute("data-i18n-html"))});
    $("lhi").className = LANG==="hi"?"on":""; $("len").className = LANG==="en"?"on":"";
    $("prev").setAttribute("aria-label",t("prev")); $("next").setAttribute("aria-label",t("next"));
    if(!BUSY) $("submit").textContent = t("send");
    updateEst(); render();
    Object.keys(lastErr).forEach(function(k){setErr(k,lastErr[k])});
    if(lastTop) topErr(lastTop,true);
  }
  function setLang(l){LANG=l; try{localStorage.setItem("lang",l)}catch(e){} applyLang()}
  $("lhi").onclick=function(){setLang("hi")};
  $("len").onclick=function(){setLang("en")};

  $("days").addEventListener("click",function(e){
    var b = e.target.closest("button.day"); if(!b || b.disabled) return;
    selected = b.getAttribute("data-d"); setErr("preferred_date",""); render();
  });
  $("prev").onclick = function(){view = new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()-1,1)); render()};
  $("next").onclick = function(){view = new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()+1,1)); render()};

  function loadBooked(){
    fetch(API).then(function(r){return r.json()}).then(function(j){
      if(!j||!j.ok) throw 0;
      booked = {}; (j.booked_days||[]).forEach(function(d){booked[String(d).slice(0,10)] = 1});
      if(selected && !isFree(selected)) selected = "";
      $("calErr").hidden = true; render();
    }).catch(function(){$("calErr").hidden = false});
  }

  function updateService(){
    var v = $("service").value;
    $("areaBox").hidden = v!=="Full Deep Cleaning";
    $("floorNote").hidden = v!=="Floor Care Service";
    updateEst();
    if(selected && !isFree(selected)) selected = "";
    render();
  }
  function updateEst(){
    var a = +$("area_sqft").value, box = $("est");
    if($("service").value==="Full Deep Cleaning" && a>0){
      var tot = a*RATE, adv = Math.round(tot*0.2);
      box.hidden = false;
      box.innerHTML = t("estLine")(tot.toLocaleString("en-IN"), a, adv.toLocaleString("en-IN"));
    } else box.hidden = true;
  }
  $("service").addEventListener("change",updateService);
  $("area_sqft").addEventListener("input",function(){updateEst(); if(selected && !isFree(selected)) selected=""; render()});

  // setErr takes a message KEY (or "" to clear)
  function setErr(k,key){
    var el = document.querySelector('.err[data-for="'+k+'"]');
    if(key){lastErr[k]=key} else {delete lastErr[k]}
    if(el) el.textContent = key ? t(key) : "";
  }
  function clearErrs(){
    lastErr = {}; lastTop = "";
    document.querySelectorAll(".err").forEach(function(e){e.textContent=""});
    $("topErr").hidden = true;
  }
  var lastTop = "";
  function topErr(key,quiet){
    lastTop = key;
    var b=$("topErr"); b.textContent=t(key); b.hidden=false;
    if(!quiet) b.scrollIntoView({behavior:"smooth",block:"center"});
  }

  function normPhone(v){
    var d = String(v).replace(/\D/g,"");
    if(d.length===12 && d.indexOf("91")===0) d = d.slice(2);
    return d;
  }

  function validate(){
    clearErrs(); var ok = true;
    function bad(k,m){setErr(k,m); ok=false}
    if(!$("customer_name").value.trim()) bad("customer_name","e_name");
    if(!$("gym_name").value.trim()) bad("gym_name","e_gym");
    if(!/^[6-9]\d{9}$/.test(normPhone($("phone").value))) bad("phone","e_phone");
    if(!$("city").value.trim()) bad("city","e_city");
    if(!$("address").value.trim()) bad("address","e_addr");
    var sv = $("service").value;
    if(!sv) bad("service","e_service");
    if(sv==="Full Deep Cleaning"){
      var a = $("area_sqft").value;
      if(!/^\d+$/.test(a) || +a<1 || +a>1000000) bad("area_sqft","e_area");
    }
    if(!selected) bad("preferred_date","e_date");
    else if(!isFree(selected)) bad("preferred_date","e_taken");
    if(!$("agree").checked) bad("agree","e_agree");
    return ok;
  }

  var BUSY = false;
  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    if(BUSY) return;
    if(!validate()){
      var f = document.querySelector(".err:not(:empty)"); if(f) f.scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
    var body = {
      customer_name: $("customer_name").value.trim(),
      gym_name: $("gym_name").value.trim(),
      phone: normPhone($("phone").value),
      city: $("city").value.trim(),
      address: $("address").value.trim(),
      service: $("service").value,
      preferred_date: selected,
      website: $("website").value
    };
    if(body.service==="Full Deep Cleaning") body.area_sqft = +$("area_sqft").value;

    BUSY = true; $("submit").disabled = true; $("submit").textContent = t("sending");
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {s:r.status,j:j}})})
      .then(function(o){
        if(o.s===201 && o.j && o.j.ok){
          $("refCode").textContent = o.j.reference || "OK";
          $("form").hidden = true; $("success").hidden = false;
          window.scrollTo({top:0,behavior:"smooth"});
        } else if(o.s===409){
          var m = (o.j && o.j.error) || "";
          topErr(m.indexOf("phone number")>=0 ? "s_phone" : "s_taken");
          loadBooked();
        } else if(o.s===429){ topErr("s_429");
        } else if(o.s===400){ topErr("s_400");
        } else { topErr("s_500"); }
      })
      .catch(function(){topErr("s_net")})
      .then(function(){BUSY=false; $("submit").disabled=false; $("submit").textContent=t("send")});
  });

  applyLang(); loadBooked();
})();
</script>
</body>
</html>
