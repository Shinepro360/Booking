<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ShinePro360 एडमिन</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0f1a22;--card:#16262f;--line:#233844;--text:#e8f1f5;--mute:#8fa7b3;--teal:#3db5c5;--green:#5fd4a0;--amber:#f0b455;--red:#ef7a7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.5;padding:16px;max-width:720px;margin-inline:auto}
h1{font-size:1.4rem;margin:0}
h1 b{color:var(--teal)}
input,button{font:inherit}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:10px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--teal);color:#06232a}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.ok{background:var(--green)}
button.bad{background:transparent;color:var(--red);border:1px solid var(--red)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.tabs button{white-space:nowrap}
.tabs button:not(.on){background:transparent;color:var(--mute);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:700;font-size:1.05rem}
.code{font-family:ui-monospace,monospace;color:var(--teal);letter-spacing:.08em}
.meta{color:var(--mute);font-size:.9rem;margin:2px 0}
.badge{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pending{color:var(--amber)}.confirmed{color:var(--green)}.cancelled{color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts a{display:inline-block;text-decoration:none;padding:10px 14px;border-radius:10px;background:var(--teal);color:#06232a;font-weight:600}
.msg{color:var(--red);min-height:1.4em}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.hide{display:none}
</style>
</head>
<body>

<section id="login">
  <h1>Shine<b>Pro360</b> एडमिन</h1>
  <p class="meta">अपना ईमेल और पासवर्ड डालकर लॉगिन करें।</p>
  <input id="em" type="email" placeholder="ईमेल" autocomplete="username">
  <input id="pw" type="password" placeholder="पासवर्ड" autocomplete="current-password">
  <button id="btnLogin">लॉगिन करें</button>
  <p class="msg" id="loginMsg"></p>
</section>

<section id="app" class="hide">
  <div class="top">
    <h1>बुकिंग</h1>
    <div>
      <button class="ghost" id="btnRefresh">रीफ़्रेश</button>
      <button class="ghost" id="btnOut">लॉगआउट</button>
    </div>
  </div>
  <input id="q" type="search" placeholder="नाम, फ़ोन, जिम या रेफ़रेंस कोड से खोजें">
  <div class="tabs" id="tabs"></div>
  <p class="msg" id="appMsg"></p>
  <div id="list"></div>
</section>

<script>
// ====== यहाँ अपनी Supabase की दो चीज़ें डालें (Project Settings → API) ======
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // सिर्फ़ anon/public key, service_role कभी नहीं
// ================================================================================

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const LABEL = {all:"सभी", pending:"इंतज़ार में", confirmed:"पक्की", cancelled:"रद्द"};
let rows = [], daysMap = {}, filter = "pending";

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
const refCode = b => String(b.ref_code || b.reference_code || b.id).replace(/-/g,"").slice(0,8).toUpperCase();
const fmtDate = d => d ? new Date(d).toLocaleDateString("hi-IN",{day:"numeric",month:"short",year:"numeric"}) : "—";
const fmtTime = d => d ? new Date(d).toLocaleString("hi-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";

async function showApp(){
  $("login").classList.add("hide");
  $("app").classList.remove("hide");
  await load();
}

async function init(){
  const { data:{ session } } = await db.auth.getSession();
  if(session) showApp();
}

$("btnLogin").onclick = async () => {
  $("loginMsg").textContent = "";
  const { error } = await db.auth.signInWithPassword({ email:$("em").value.trim(), password:$("pw").value });
  if(error){ $("loginMsg").textContent = "लॉगिन नहीं हुआ: ईमेल या पासवर्ड जाँचें।"; return; }
  showApp();
};
$("btnOut").onclick = async () => { await db.auth.signOut(); location.reload(); };
$("btnRefresh").onclick = load;
$("q").oninput = render;

async function load(){
  $("appMsg").textContent = "";
  const { data, error } = await db.from("Booking").select("*").order("created_at",{ascending:false});
  if(error){ $("appMsg").textContent = "बुकिंग नहीं मिलीं। जाँचें कि यह अकाउंट एडमिन है: " + error.message; return; }
  rows = data || [];
  daysMap = {};
  const r = await db.from("booking_days").select("booking_id, day");
  if(!r.error && r.data) r.data.forEach(d => (daysMap[d.booking_id] = daysMap[d.booking_id] || []).push(d.day));
  render();
}

function renderTabs(){
  const t = $("tabs"); t.replaceChildren();
  Object.keys(LABEL).forEach(k => {
    const n = k === "all" ? rows.length : rows.filter(b => b.status === k).length;
    const b = el("button", k === filter ? "on" : "", LABEL[k] + " (" + n + ")");
    b.onclick = () => { filter = k; render(); };
    t.appendChild(b);
  });
}

function render(){
  renderTabs();
  const q = $("q").value.trim().toLowerCase();
  const list = $("list"); list.replaceChildren();
  const shown = rows.filter(b => (filter === "all" || b.status === filter) &&
    (!q || [b.customer_name, b.phone, b.gym_name, refCode(b)].join(" ").toLowerCase().includes(q)));
  if(!shown.length){ list.appendChild(el("p","empty","कोई बुकिंग नहीं मिली।")); return; }
  shown.forEach(b => list.appendChild(card(b)));
}

function card(b){
  const c = el("div","card");
  const top = el("div","row");
  const left = el("div");
  left.appendChild(el("div","name", b.customer_name || "—"));
  left.appendChild(el("div","code", refCode(b)));
  top.appendChild(left);
  top.appendChild(el("span","badge " + b.status, LABEL[b.status] || b.status));
  c.appendChild(top);

  c.appendChild(el("div","meta", (b.gym_name || "—") + (b.city ? ", " + b.city : "")));
  if(b.address) c.appendChild(el("div","meta", b.address));
  c.appendChild(el("div","meta", (b.service || "—") + " · " + (b.area_sqft || "?") + " sqft"));
  const days = daysMap[b.id];
  c.appendChild(el("div","meta", "तारीख: " + (days && days.length ? days.map(fmtDate).join(", ") : fmtDate(b.preferred_date))));
  if(b.status === "pending" && b.hold_expires_at)
    c.appendChild(el("div","meta pending", "होल्ड खत्म: " + fmtTime(b.hold_expires_at)));

  const acts = el("div","acts");
  const call = el("a","", "कॉल करें: " + b.phone);
  call.href = "tel:" + String(b.phone).replace(/[^0-9+]/g,"");
  acts.appendChild(call);
  if(b.status === "pending"){
    const ok = el("button","ok","एडवांस मिला, पक्की करें");
    ok.onclick = () => setStatus(b, "confirmed", "एडवांस मिल गया? बुकिंग पक्की करें।");
    acts.appendChild(ok);
  }
  if(b.status !== "cancelled"){
    const no = el("button","bad","रद्द करें");
    no.onclick = () => setStatus(b, "cancelled", "यह बुकिंग रद्द होगी और तारीख खाली हो जाएगी। पक्का?");
    acts.appendChild(no);
  }
  c.appendChild(acts);
  return c;
}

async function setStatus(b, status, ask){
  if(!confirm(ask)) return;
  const { error } = await db.from("Booking").update({ status }).eq("id", b.id);
  if(error){ $("appMsg").textContent = "बदलाव नहीं हुआ: " + error.message; return; }
  await load();
}

init();
</script>
</body>
</html>
